# Checks every push and pull request, weekly (to catch Home Assistant changes), and on demand.
# Everything here except hassfest can also be run locally; see CONTRIBUTING.md.
# Every action is pinned to a commit (the version it was is in the comment); update both together.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format (ruff), panel scripts (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - run: pip install -r tests/requirements.txt # exact versions, with hashes
      - run: ruff check
      - run: ruff format --check
      - name: Panel scripts parse
        run: for f in custom_components/life_rpg/frontend/*.js; do node --check "$f"; done

  hassfest:
    name: Home Assistant's integration checks (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # master on 2026-11-22

  tests_engine:
    name: Tests (engine tests, 3-year soak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python tests/test_engine.py
      # five player profiles x two seeds, 3 years each (the full check is 30 years: see CONTRIBUTING.md)
      - run: python tests/test_engine_soak.py 3 1 2

  tests_integration:
    name: Tests (Home Assistant side, fake ComfyUI and LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install -r tests/requirements.txt
      - run: python tests/test_integration.py
      - run: python tests/test_integration_soak.py 0.5 sdxl
      - run: python tests/test_integration_soak.py 0.5 flux_unet
      - run: python tests/test_release.py
      - name: Build life_rpg.zip, and check it installs
        run: python scripts/build_package.py
