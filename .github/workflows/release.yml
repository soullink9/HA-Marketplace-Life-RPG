# Publishes GitHub's releases: life_rpg.zip, with release notes taken from that version's section of
# CHANGELOG.md. This is the copy the Marketplace installs and updates from.
# (.gitea/workflows/release.yml publishes them on Gitea first; both use the scripts in scripts/.)
#
# GitHub ends up with the same releases as Gitea: the same files, title and notes. Releases start on Gitea, and
# Gitea's push mirror brings their tags here (every 8 hours). Every push from the mirror starts this workflow:
#   1. plan: lists the version tags with no published release here yet (scripts/plan_github_releases.py).
#      Checking every tag, not only the one pushed, matters: when more than three tags arrive in one push GitHub
#      starts no workflow for any of them, and a release whose run failed gets another go at the next push.
#   2. check: for each of them, checks out the tag and runs every check, with a read-only token.
#   3. release: for each tag whose checks passed, oldest first, builds the same files Gitea built (the builds are
#      repeatable, byte for byte) and publishes them with the same title and notes.
# Only the release job can write to the repository, and it installs nothing: the packages the tests need (from
# PyPI) never run where the write token is, and no job leaves its token in the checkout.
# Every action is pinned to a commit (the version it was is in the comment); update both together.
# Actions tab → Release → Run workflow does the same straight away, without waiting for the mirror.
# It never creates a tag: the mirror deletes tags Gitea doesn't have, so a tag made here wouldn't last.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:

permissions:
  contents: read # only the release job, which installs nothing, may write

# One run at a time: a mirror push that moves main and brings a tag starts this twice, and the second run then
# finds the release already published instead of racing the first to create it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # No telemetry (CONTRIBUTING.md): DO_NOT_TRACK tells every tool that honours it not to report usage
  DO_NOT_TRACK: "1"
  # gh sends usage telemetry by default, from CI too; GH_TELEMETRY is its own switch and wins over DO_NOT_TRACK
  GH_TELEMETRY: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to compare with GitHub's releases
          persist-credentials: false

      - name: Find the version tags GitHub has no release for
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,isDraft > releases.json
          python3 scripts/plan_github_releases.py releases.json "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    name: Check ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a version that fails its checks doesn't hold up the others
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }} # the release is built from its tag, as on Gitea
          persist-credentials: false

      # Home Assistant 2026.11 runs on Python 3.14 and supports nothing older, so that's what the tests run on
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Check the version and the release notes in CHANGELOG.md
        env:
          TAG: ${{ matrix.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$GITHUB_REPOSITORY" notes.md

      - name: Install what the checks need
        run: pip install -r tests/requirements.txt

      - name: Lint and format (ruff)
        run: ruff check && ruff format --check

      - name: Run every test
        run: |
          # short soaks: five player profiles x two seeds for 3 years, then each image model for half a
          # year (the full runs are 30 and 3 years: see CONTRIBUTING.md)
          python3 tests/test_engine.py
          python3 tests/test_engine_soak.py 3 1 2
          python3 tests/test_integration.py
          python3 tests/test_integration_soak.py 0.5 sdxl
          python3 tests/test_integration_soak.py 0.5 flux_unet
          python3 tests/test_release.py

      - name: Panel scripts parse
        run: for f in custom_components/life_rpg/frontend/*.js; do node --check "$f"; done

      - name: Build life_rpg.zip, and check it installs as custom_components/life_rpg/
        run: python3 scripts/build_package.py

      # The release job publishes a tag only when this exists, so one version failing doesn't stop the others.
      - name: Mark the tag as checked
        env:
          TAG: ${{ matrix.tag }}
        run: echo "$TAG" > checked.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-${{ matrix.tag }}
          path: checked.txt
          retention-days: 1

  release:
    needs: [plan, check]
    # runs even when some tag failed its checks; each tag below publishes only if its own checks passed
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.releases != '[]' }}
    name: Release ${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases
    strategy:
      max-parallel: 1 # one at a time, oldest version first
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - name: Only a tag whose checks passed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-${{ matrix.tag }}
          path: ${{ runner.temp }}/checked

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false

      # the release scripts use only Python itself: nothing is installed in this job
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Take the release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ matrix.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$GITHUB_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      # The asset keeps the same name in every release: .../releases/latest/download/life_rpg.zip relies on it.
      - name: Build life_rpg.zip, and check it installs as custom_components/life_rpg/
        run: python3 scripts/build_package.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          LATEST: ${{ matrix.latest }}
        run: |
          # A draft on this tag is what GitHub leaves when a tag goes missing from Gitea for a while: replace it.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # "Latest" only for the newest version without a suffix, so publishing an older version after a newer one
          # doesn't make it the one .../releases/latest/download/ hands out.
          flags=(--latest="$LATEST")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # --verify-tag: publish on the tag Gitea sent, and never create one
          gh release create "$TAG" dist/* --verify-tag --title "$TITLE" --notes-file notes.md "${flags[@]}"
