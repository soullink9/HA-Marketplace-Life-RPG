# Kids mode: tell a parent when a child says a chore is done
# Settings → Automations & scenes → Create automation → Create new automation → ⋮ → Edit in YAML.
# Select everything in the editor, paste this whole file over it, then change event.kid_achievements to the child's event entity and
# notify.mobile_app_parent_phone to the parent's phone (or switch to the visual editor and pick both). Save.
# Home Assistant 2026.11 or newer. Nothing goes in the config folder.
alias: Life RPG - Chore waiting for approval
description: A child marked a chore done on the bounty board; open the System panel to approve it.
mode: queued
max: 25
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: event.kid_achievements
    not_from: unavailable
    not_to: [unavailable, unknown]
conditions:
  # A real new claim, not the entity coming back after a restart or reload.
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.to_state.attributes.event_type == 'bounty_claimed' }}
actions:
  - action: notify.mobile_app_parent_phone
    data:
      title: "[Chore done?]"
      message: "{{ trigger.to_state.attributes.player }} says {{ trigger.to_state.attributes.bounty }} is done. Tap to approve it in the System panel."
      data:
        clickAction: /life-rpg
        url: /life-rpg
        tag: life-rpg-chore
